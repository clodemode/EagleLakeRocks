# EagleLakeRocks — rocks.opeongo.net
#
# A Go static binary + SQLite on a persistent volume. 18 rocks, no background
# jobs. Sized deliberately small; see SPEC for why the stack is not Django.
app = "eagle-lake-rocks"
primary_region = "yyz"   # Toronto — Eagle Lake is in Frontenac County, Ontario

[build]

[env]
  DATA_DIR = "/data"
  PORT = "8080"

[[mounts]]
  source = "rocks_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true

  # SUSPEND, not stop — fleet standard. A stopped machine pays a full VM boot
  # before it answers; the fleet measured that at 22.6 s to first byte against
  # 0.37 s warm (fintrack, 2026-08-04). Suspend restores the running process
  # from a RAM snapshot in a few hundred ms, and Fly bills rootfs only in BOTH
  # states — so the latency is bought for free. 256 mb is far under the 2 GB
  # suspend cap. The /data volume is untouched; suspend snapshots memory only.
  #
  # STANDING CAVEAT: resume does NOT re-run the entrypoint. All boot work here
  # is deploy-coupled (schema create, first-boot seed, private overlay) and
  # never time-coupled, so that is safe. Under suspend this machine can run for
  # months without a cold boot — do NOT add periodic work to startup without
  # revisiting this, or it will silently stop firing.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
