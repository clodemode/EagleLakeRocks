<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Perch, a bald eagle">
  <title>Perch</title>
  <!-- body -->
  <path d="M32 20c-7 0-12 5-12 12 0 7 4 13 12 20 8-7 12-13 12-20 0-7-5-12-12-12z" fill="#5a4326"/>
  <!-- folded wings -->
  <path d="M20 30c-4 2-7 7-7 12 3-1 6-3 8-6z" fill="#43331d"/>
  <path d="M44 30c4 2 7 7 7 12-3-1-6-3-8-6z" fill="#43331d"/>
  <!-- white head -->
  <path d="M32 6c-6 0-10 4-10 10 0 4 2 7 5 9h10c3-2 5-5 5-9 0-6-4-10-10-10z" fill="#f7f7f4"/>
  <path d="M32 6c-6 0-10 4-10 10 0 1 0 2 .3 3 2-4 5-6 9.7-6s7.7 2 9.7 6c.2-1 .3-2 .3-3 0-6-4-10-10-10z" fill="#ffffff"/>
  <!-- brow: the lookout's set -->
  <path d="M23.5 13.5c2-1.6 4.4-2.4 6.5-2.3l-.4 2.2c-2 .1-4 .8-5.6 2z" fill="#d9d6cd"/>
  <path d="M40.5 13.5c-2-1.6-4.4-2.4-6.5-2.3l.4 2.2c2 .1 4 .8 5.6 2z" fill="#d9d6cd"/>
  <!-- eyes, fixed on the water -->
  <circle cx="27.5" cy="16" r="1.9" fill="#1a1207"/>
  <circle cx="36.5" cy="16" r="1.9" fill="#1a1207"/>
  <circle cx="28.1" cy="15.4" r=".6" fill="#fff"/>
  <circle cx="37.1" cy="15.4" r=".6" fill="#fff"/>
  <!-- hooked beak -->
  <path d="M32 17.5c2.6 0 4.6 1.6 4.6 3.6 0 2.2-2 4.4-4.6 5.4-2.6-1-4.6-3.2-4.6-5.4 0-2 2-3.6 4.6-3.6z" fill="#f0b429"/>
  <path d="M32 22.6c1.4.9 2.4 2.2 2.6 3.5-.9.5-1.8.9-2.6 1.2z" fill="#d69a1a"/>
  <!-- the rock she watches from -->
  <path d="M14 56l7-9 6-3 9 4 6-2 8 10z" fill="#8a8478"/>
  <path d="M21 47l6-3 9 4-7 8z" fill="#a09a8d"/>
  <!-- talons, gripping the ridge (painted after the rock so they read) -->
  <path d="M28 47.5l-2.5 3.5M32 48.5l0 3.6M36 47.5l2.5 3.5"
        stroke="#f0b429" stroke-width="2.3" stroke-linecap="round" fill="none"/>
  <path d="M25.2 50.6l-1.4 1.2M32 51.9l0 1.6M38.8 50.6l1.4 1.2"
        stroke="#d69a1a" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <!-- water -->
  <path d="M2 59q8 3 16 0t16 0 16 0 12 0" stroke="#2f6fb5" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M2 63q8 3 16 0t16 0 16 0 12 0" stroke="#4f93d8" stroke-width="1.8" fill="none" stroke-linecap="round"/>
</svg>
